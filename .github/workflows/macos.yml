name: macOS packages
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'backend/**'
      - '*macos*'
      - 'CMakeLists.txt'
      - '.github/workflows/macos.yml'
      - 'tools/*macos*'
      - 'test/*macos*'
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      INDE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            build/pcl-macos
            build/macos-${{ matrix.arch }}/lib
          key: pcl-201860a-macos15-${{ matrix.arch }}-v1
      - name: Build native module
        run: bash build-macos.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test provider selection
        run: python3 -m unittest discover -s test -p test_macos_runtime.py
      - name: Check pinned Windows model package
        id: source
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.1-local/InDe-1.0.1-local-windows-x64.zip"
          if curl --fail --silent --show-error --location --head "$url" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The authorized v1.0.1-local Windows model package is not published yet; native build and provider tests completed without macOS packaging."
          fi
      - name: Package runtime and test all three models
        if: steps.source.outputs.available == 'true'
        run: python3 tools/package-macos.py --model-distribution-authorized
      - name: Check relocated package and installer
        if: steps.source.outputs.available == 'true'
        run: |
          set -euo pipefail
          bash -n setup-macos.sh Install-macOS.command build-macos.sh
          target="$RUNNER_TEMP/InDe 安装测试"
          mkdir -p "$target"
          tar -xzf "release/InDe-1.0.1-local-macos-$INDE_ARCH.tar.gz" -C "$target"
          package="$target/InDe-1.0.1-local-macos-$INDE_ARCH"
          python="$package/InDeBackend/runtime/bin/python3"
          "$python" -I -B -c 'import numpy, cv2, onnxruntime; print(onnxruntime.get_available_providers())'
          # A Mach-O fixture exercises preflight without launching or signing PixInsight.
          fixture="$RUNNER_TEMP/Fixture.app/Contents/MacOS"
          mkdir -p "$fixture"
          cp -L "$python" "$fixture/PixInsight"
          bash "$package/setup-macos.sh" --check-only --pixinsight-app "$RUNNER_TEMP/Fixture.app"
          printf '\nchanged\n' >> "$package/test/native-selftest.js"
          if bash "$package/setup-macos.sh" --check-only --pixinsight-app "$RUNNER_TEMP/Fixture.app"; then
            echo 'Corrupted package unexpectedly passed verification'; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.available == 'true'
        with:
          name: package-macos-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS-macos-*.txt
          if-no-files-found: error
